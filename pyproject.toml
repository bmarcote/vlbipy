[build-system]
requires = ["setuptools >= 68.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "vlbipy"
version = "0.5.1"
description = "Backend-agnostic VLBI data reduction suite (API-first)"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Benito Marcote", email = "marcote@jive.eu"}]
dependencies = [
    "numpy",
    "matplotlib",
    "astropy",
    "loguru",
    "rich",
    "rich-argparse",
    "tomli; python_version < '3.11'",
    "casatools",
    "casatasks"
]

[project.optional-dependencies]
# dask-ms (0.2.32) writes zarr stores with the zarr 2 API (zarr.convenience, gone in zarr 3) and
# pins zarr<3 / numcodecs<0.16 through its own [zarr] extra. Repeated here so that an upgrade of
# the environment (pip/uv --upgrade) cannot pull zarr 3 in and break xds_to_zarr.
daskms = ["dask-ms[xarray,zarr]", "zarr>=2.18,<3", "numcodecs>=0.13,<0.16", "difmapy", "numba"]
aips = ["parseltongue"]
difmap = ["difmapy"]
notebook = ["nbformat", "ipykernel", "jupyterlab", "ipywidgets", "plotly", "anywidget"]
all = ["casatools", "casatasks", "parseltongue", "dask-ms[xarray,zarr]", "zarr>=2.18,<3",
       "numcodecs>=0.13,<0.16", "difmapy", "numba",
       "nbformat", "ipykernel", "jupyterlab", "ipywidgets", "plotly", "anywidget"]
dev = ["pytest", "ruff"]

[project.scripts]
vlbipy = "vlbipy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vlbipy = ["templates/*.toml", "data/*.fits", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
