# vlbipy default configuration.
# Three-layer cascade: these defaults -> user TOML/dict -> constructor/CLI overrides.
# Later layers win.

[global]
project = ""
observatory = "EVN"          # EVN | VLBA | LBA (or any registered/plugin observatory)
backend = "casa"             # casa (default) | dask-ms (fast numpy calibration + difmapy imaging) | dummy | aips | plugin
mode = "continuum"          # continuum | spectral-line | pulsar-binning | multi-phase-center
reference_antenna = []       # preferred refant(s); auto-ranked if empty
work_dir = ""               # working directory; empty = cwd
plugins = []                 # dotted module paths loaded before backend/observatory
                             # resolution (e.g. ["mypkg.vlbipy_plugin"]); each module's
                             # top-level code may call register_backend / register_observatory

[sources]
fringe_finders = []
phase_calibrators = []
targets = []
check_sources = []
polarization_calibrators = []

# Phase referencing: which sources the phases are solved on and how they reach the others (vlbipy.phaseref).
# The reference sources are the phase calibrators, or the targets with `inverse = true` (inverse phase
# referencing: solve on a bright target, transfer to the calibrators; "target" still names the source of
# interest). With several reference sources:
#   "sequential"  solve on the brightest and apply it everywhere, then solve each next one on data already
#                 corrected by it: its second-order solutions go to the later references and the targets;
#   "interpolate" solve each on its own; a target takes their phases, delays and rates combined along the
#                 line joining the two nearest on the sky (1-D, by its projection onto that line);
#   "time"        a target takes the solutions of whichever reference was observed closest in time;
#   "auto"        "sequential" when the brightest is `brightness_ratio` times brighter (fringe SNR) than the
#                 next one, "interpolate" otherwise.
# Changing the strategy needs a re-run from the fringe fit (--from-step fringefit).
# Any other key is a calibrator -> target map entry: key = target name, value = calibrator name or list.
# Example:
#   "3C286"     = "J1048+7143"
#   "R20181030" = ["J1027+7428", "J1048+7143"]
[phase_referencing]
inverse = false              # --inverse-phaseref
strategy = "auto"            # --phaseref-strategy: auto | sequential | interpolate | time
brightness_ratio = 3.0
order = []                   # sequential solve order; default brightest first
max_extrapolation = 1.0      # interpolate: furthest beyond either reference, in units of their separation
max_gap = 600.0              # interpolate (and auto): both references observed within this many seconds,
                             # before and after, or a receiver time takes the time interpolation

[import]
scan_gap = 15                # seconds; gap defining a new scan boundary
mms = true                   # partition the imported MS into a Multi-MS (parallel I/O)
obsdate = ""                 # YYMMDD; empty = auto-resolve (FITS-IDI RDATE or archive index)
username = ""                # archive credentials for proprietary data (empty = public)
password = ""
replace_tsys = false         # overwrite Tsys/GC tables in the FITS-IDI even if already present
reset_existing = true        # clearcal + unflag an existing MS so a previous attempt's state
                             # does not carry over (flags otherwise only accumulate)
unflag_existing = true       # part of the reset: clear all flags (re-applied by flag.apriori)
backup_flags = true          # save a restorable flag version before unflagging
zarr_store = false           # dask-ms backend: also write <code>.zarr (lazy access; report without the MS)

[flagging]
# Quack (slewing time at scan start), applied before any solve. Per-antenna values in
# [flagging.quack_antennas] win; otherwise quack_interval applies to every antenna; when
# neither is set the ramp is measured from the raw data per antenna.
quack_interval = 0           # seconds for every antenna (0 = not configured)
quack_sigma = 2.0            # MADs below the baseline's scan median that count as off-source
quack_max_seconds = 50.0     # never trim more than this from a scan start (measured mode)
flag_autocorrelations = true
# Subband edge channels: measured from the bandpass roll-off when a bandpass table exists,
# otherwise edge_channels_fraction of each subband is flagged blindly on each edge.
edge_channels_fraction = 0.05
edge_outlier_sigma = 6.0     # MAD sigmas defining the flat interior of a subband
max_edge_fraction = 0.25     # never trim more than this fraction from either subband edge
aoflagger_strategy = "default"
flag_outliers = true         # post-calibration per-baseline spike/drop flagging (see
                             # flag.outliers). Set false to skip it: on sparse calibrators
                             # its statistics rest on very few time bins, and flags landing
                             # on the instrumental-calibration scan cost the next pass whole
                             # antennas. RFI is already handled by tfcrop/aoflagger.
outlier_sigma = 5.0          # robust-sigma cut for per-baseline outlier flagging
outlier_gross_departure = 0.25  # a baseline with too many outliers to trust the sigma cut still loses the
                             # time bins further than this fraction from its local level ...
outlier_gross_max_fraction = 0.35  # ... unless they are more than this share of the baseline
weak_polarization_ratio = 5.0  # flag a receptor without fringes while its pair has them (before any solve),
                             # or this many times weaker in amplitude (scalar bandpass); 0 = off
bandpass_min_gain = 0.5      # channels whose bandpass solution is flagged or below this (subband median = 1)
                             # are flagged per antenna and subband after the bandpass
flag_off_source = true       # after the first apply: flag antennas while they are still slewing or have dropped
                             # out, measured per integration on the calibrators and transferred to the faint fields
off_source_level = 0.8       # an antenna is off source when all its baselines sit below this fraction of their level

# Seconds to quack per antenna, e.g. EF = 4. Empty = use quack_interval / measure.
[flagging.quack_antennas]

# Initial auto-flagging of the calibrators (per baseline; flags are never extended).
[flagging.tfcrop]
timecutoff = 4.0
freqcutoff = 3.0

[calibration]
parang = true                # parallactic-angle correction in all cal steps
refant_snr_select = true     # data-driven SNR-based reference-antenna selection
eop_file = ""                # usno_finals.erp path for EOP corrections (VLBA/LBA); empty = auto-download
snr_channel_fraction = 0.8   # central fraction of each subband used by the per-scan SNR survey
                             # (0.8 = drop 10% at each edge, where the band rolls off)
ionos = true                 # solve the dispersive delay in the fringe fit below
                             # ionos_max_ghz; false disables it at any frequency
ionos_max_ghz = 8.0          # the ionosphere matters below this observing frequency
snr_max_scans = 24           # cap on scans fringe-fitted by the survey (0 = all);
                             # it only needs relative SNR, so a sample suffices
smooth_tsys = true           # de-spike the Tsys table after gencal
tsys_outlier_sigma = 6.0     # MAD sigmas beyond which a Tsys solution is an outlier
tsys_smooth_passes = 3       # maximum de-spiking passes
detection_snr = 7.0          # fringe SNR above which an antenna counts as detected
weak_scan_level = 0.3        # an antenna below this fraction of its own best scan (raw amplitude) is not
                             # solved on that scan, however well it is detected (0 = do not check)
callib = false               # use CASA cal-library files; false uses explicit parallel
                             # gaintable/gainfield/interp/spwmap/calwt parameters

# Every key in a [calibration.*] section is passed straight through to the backend
# function of the same name, so any parameter it accepts can be tuned here.
[calibration.sbd]
solint = "inf"
minsnr = 10.0
channel_fraction = 0.8       # central channels used (edges are not yet bandpass-corrected);
                             # 0.8 drops 10% at each edge. The solve window only decides
                             # which channels constrain the fit — it is applied to all of them.
zerorates = true             # instrumental delay is constant in time: do not fit a rate

[calibration.bandpass]
solint = "inf"
combine = "scan,field"       # one bandpass per antenna from every selected scan and source (a staggered
                             # array sees each fringe finder with part of the antennas only)
minsnr = 3.0
solnorm = true               # normalise: keep the band shape, not the flux scale
bandtype = 'B'
fillgaps = 8                 # interpolate over flagged channel gaps up to this width

[calibration.scalar_bandpass]
solint = "inf"               # one amplitude per antenna and subband for the whole run
combine = "scan"
minsnr = 3.0
solnorm = true               # keep the a-priori flux scale; level the subbands only
fill_unsolved = true         # an unsolved antenna/subband gets gain 1 instead of flagging its data

[calibration.mbd]
solint = "inf"
combine = "spw"              # pool the subbands for sensitivity (needs an spw map at apply)
minsnr = 5.0
channel_fraction = 0.8       # central channels used, as for the SBD: the edges roll off and
                             # carry the least trustworthy phase, so they must not bias the
                             # delay. The solution is still applied across the whole band.
zerorates = false            # atmospheric residuals vary in time: fit the rate
retry_minsnr = 3.0           # an antenna solved on fewer than retry_below of the calibrator scans it
retry_below = 0.5            # observed is re-solved on the rest at this SNR; the new solutions are kept
                             # only if it then reaches retry_below, otherwise the antenna's unsolved
                             # data are flagged on apply (retry_minsnr = 0 disables the retry)
max_delay_step = 0.0         # ...and only if its delays are consistent: median change between solutions
                             # at most this (ns; 0 = 1/total bandwidth). Noise peaks jump across the
                             # search window; an antenna failing this is lost (its solutions flagged)

# Time smoothing of the fringe (MBD, MBD2, ...) solutions. Each solution carries the noise
# of one solution interval, while the residual atmospheric delay and rate it measures drift
# slowly, so neighbouring solutions average that noise down. The smoothed copy
# (<code>.mbd_smooth) is what gets applied; the solved table stays on disk and is plotted
# next to it. The phase is never smoothed — it wraps.
[calibration.mbd_smooth]
window = 900.0               # full width of the centred time window in seconds (0 = apply unsmoothed).
                             # With solint = "inf" there is one solution per scan, so this spans
                             # window / cycle-time solutions: ~3 on a 5-minute phase-reference cycle.
                             # Raise it (1800-3600) to average more noise down, as long as the
                             # residual delay still drifts more slowly than that; a centred window
                             # leaves a linear drift unbiased either way.
smoothtype = "median"        # "median" (robust: also removes a single bad solution) or "mean"
parameters = ["delay", "rate"]   # Fringe Jones parameters to smooth; "dispersive" may be added
min_points = 3               # leave a solution alone when its window holds fewer than this

# Reweighting (statwt) after the full chain is applied; the pipeline then flags outliers
# again and re-solves everything (third pass). Set enabled = false to skip.
[calibration.reweight]
enabled = true
column = "corrected"
minsamp = 2

# Correlator amplitude correction from the autocorrelations, for DiFX data (VLBA, LBA): CASA accor,
# then smoothcal. Applied with nearest interpolation, like the EOP correction.
[calibration.accor]
enabled = true
solint = "30s"               # accor solution interval
smoothtype = "median"        # smoothcal filter
smoothtime = 1800.0          # smoothcal filter width in seconds (0 = apply the table unsmoothed)

[calibration.tec]
# Ionospheric correction from global TEC maps (IONEX), as AIPS TECOR/VLBATECR, for every array.
enabled = "auto"             # "auto": below the observatory's tec_below_ghz (EVN 5, VLBA/LBA 7); true; false
model = "emrg"               # IONEX product (AIPS TECRTYPE): emrg, jplg, codg, esag, igsg, upcg, casg, ...
fallback = true              # try the other products when this one is not available
interval = 30.0              # seconds between table rows inside a scan (plus each scan's first/last time)
shell_height = 0.0           # km; 0 = the height in the maps (HGT1, usually 450 km)
rotation = 1.0               # AIPS APARM(2): interpolate in time between maps rotated with the Sun (0 = not)
mapping = "thin_shell"       # "thin_shell" or "petrov" (Petrov 2023 modified mapping, AIPS APARM(4-6))
ionex_files = []             # use these IONEX files instead of downloading
ionex_dir = ""               # where the maps are cached; empty = <work_dir>/ionex

[calibration.tsys_smooth]
window = 5                   # running-median window, in solutions, used to de-spike Tsys

[calibration.snr_survey]
minsnr = 0.0                 # keep every solution so weak antennas still appear in the survey

[selfcal]
# Self-calibration with difmapy (see vlbipy.backends.difmap): one circular Gaussian modelfit, a
# phase-only ladder from long to short solution intervals, then the Bayesian gscale for the
# station amplitudes. Fringe finder first (amplitudes -> every field), then the phase
# calibrator (amplitudes + phases -> itself, the targets and the check sources).
enabled = true
solints = []                 # phase ladder; empty = 30min, 10min, 5min, scan (+ 2min for scans > 5 min)
min_improvement = 0.002      # a step must lower the weighted chi-squared by this fraction (0.2%)
max_bad_fraction = 0.25      # ... and fail in at most this fraction of its solution bins
bayes_models = ["clean", "gauss1", "gauss2", "gauss3"]  # source models weighed by bayes_gscale
prior_sigma = 0.1            # a-priori amplitude accuracy: a station within it is left alone (10%)
outlier_sigma = 1.0          # spread of a station that is off (log amplitude): corrected almost in full
joint_amplitude = true       # multi-epoch stage: also re-solve the station amplitudes of each epoch against the
                             # joint calibrator model (bayes_gscale, prior_sigma/outlier_sigma as above; false:
                             # phases only, the epochs keep the amplitudes their own models gave)
workers = 0                  # threads for bayes_gscale (0 = difmapy's default)

[imaging]
mapsize = 8192               # difmapy: width in pixels of the map the images are made on (the FITS keeps the
                             # valid inner half, 4096 px); cell = resolution / 10
average_channels = true      # difmapy: average each subband to one channel before CLEAN (much faster; set
                             # false for fields wider than ~1 arcsec, where bandwidth smearing matters)
imager = "difmap"            # "difmap" (difmapy on the per-source split) | "tclean"; dask-ms: always difmap
method = "modelfit"          # difmapy: "modelfit" = circular Gaussians, CLEAN only for what they leave, one model
                             # restored at every robust value | "clean" = CLEAN alone, each robust value on its own
max_components = 10          # modelfit: most Gaussians per source
component_sigma = 5.0        # modelfit: a Gaussian is kept only when the fit improves by this many sigma ...
component_improvement = 0.01 # ... and (after the first) removes this fraction of the chi-squared
clean_residual_sigma = 5.0   # modelfit: residual emission above this many sigma is CLEANed, in windows
weighting = "briggs"
clean_gain = 0.05            # difmapy CLEAN loop gain
robust = [-2, 0, 2]          # one image per robust value, shown side by side in the PNG preview
niter = 4000
threshold_sigma = 3.0        # clean stops when the residual peak drops below this many rms
search_fov = 1000.0          # mas; width of the dirty map searched for each source before imaging (0 = off)
search_sigma = 10.0          # a peak counts as the source only above this many rms
recentre_min_beams = 10.0    # ... and the map is re-centred on it only when it lies further than this many
                             # synthesized beams from the phase centre (closer, the regular map already holds it)
sources = "all"              # "all" (targets + calibrators) | "targets"
produce_fits = true
produce_png = true

[export]
split_per_source = true
export_uvfits = true
time_average = "10s"         # time averaging of the per-source split / UVFITS; empty = none
channel_average = -1         # calibrators and check sources: -1 = one channel per subband; N = average
                             # N channels (a subband with fewer is left as is); 1 = keep all
target_channel_average = 4   # the same for the target(s), which may sit off the phase centre
average_targets = true       # false = split the target(s) at full time and frequency resolution
radplot_time_bin = 10.0      # seconds averaged per point in the uv-distance plots
lightcurve_averaging = [0, 30, 120, -1]  # averaging scales (s) in the total light curve:
                             # 0 = native integrations, -1 = one point per scan

[plotting]
engine = "auto"              # standard plots (spectra, time series, time evolution): "jplotter" (jiveplot,
                             # fast), "matplotlib", or "auto" = jplotter when jiveplot is installed
workers = "auto"             # most plots of the diagnostic and final-data sets drawn at the same time, each in
                             # its own worker process reading its own data. "auto" = every CPU vlbipy may use
                             # (its affinity and any container/batch-job CPU quota); a number caps it. Either
                             # way only as many as their estimated peak memory allows (below), and never more
                             # than the worker pool, which is sized to the CPUs and the available memory
                             # (override with $VLBIPY_WORKERS / $VLBIPY_WORKER_MEMORY). 1 = one after another.
memory_fraction = 0.8        # share of the available memory (the system's, or what a container, batch job or
                             # systemd-run -p MemoryMax= limit leaves) the plots drawn together may take
